const models = ['FPMC','GRU4Rec','NARM','SASRec','SRGNN','STAMP'];
const ks = [5,10,15,20];
const metrics = [
  { key:'hit',   label:'HR' },
  { key:'recall',label:'Recall' },
  { key:'prec',  label:'Precision' },
  { key:'mrr',   label:'MRR' },
  { key:'map',   label:'MAP' },
  { key:'ndcg',  label:'NDCG' },
  { key:'icov',  label:'Item Coverage' },
//  { key:'gini',  label:'Gini Index' },
  { key:'apop',  label:'Avg. Popularity' },
];

function buildTable(model) {
  let html = '<table><thead>';
  // row 1: nadrzędne grupy
  html += '<tr><th rowspan="2">Metryka</th>';
  html += `<th colspan="4" class="group-r1">results_1</th>`;
  html += `<th colspan="4" class="group-rN sep">results_N</th>`;
  html += '</tr>';
  // row 2: wartości k
  html += '<tr>';
  for (let g = 0; g < 2; g++) {
    for (let i = 0; i < ks.length; i++) {
      const sep = g === 1 && i === 0 ? ' sep' : '';
      html += `<th class="${sep}">@${ks[i]}</th>`;
    }
  }
  html += '</tr></thead><tbody>';
  for (const m of metrics) {
    html += `<tr><td>${m.label}</td>`;
    for (let i = 0; i < 4; i++) {
      const v = data[model].r1[m.key][i];
      html += `<td>${m.key === 'apop' ? v.toFixed(2) : v.toFixed(4)}</td>`;
    }
    for (let i = 0; i < 4; i++) {
      const v = data[model].rN[m.key][i];
      const sep = i === 0 ? ' class="sep"' : '';
      html += `<td${sep}>${m.key === 'apop' ? v.toFixed(2) : v.toFixed(4)}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('all-tables');
  for (const model of models) {
    const block = document.createElement('div');
    block.className = 'model-block';
    block.innerHTML = `<h2>${model}</h2><div class="tbl-wrap">${buildTable(model)}</div>`;
    container.appendChild(block);
  }
});
